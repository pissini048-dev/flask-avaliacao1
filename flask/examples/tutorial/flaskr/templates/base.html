<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} - Flaskr</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">Flaskr</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('blog.index') }}">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('calculos.painel') }}">Cálculos</a>
            </li>
          </ul>

          <div class="d-flex align-items-center gap-2">
            {% if g.user %}
              {% if g.user.avatar %}
                <img
                  src="{{ url_for('static', filename='uploads/' + g.user.avatar) }}"
                  alt="Avatar de {{ g.user.username }}"
                  width="36"
                  height="36"
                  class="rounded-circle object-fit-cover border border-light"
                >
              {% endif %}
              <span class="navbar-text text-light me-2">{{ g.user.username }}</span>
              <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}">Sair</a>
            {% else %}
              <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.register') }}">Registrar</a>
              <a class="btn btn-primary btn-sm" href="{{ url_for('auth.login') }}">Entrar</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      {% for message in get_flashed_messages() %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
      {% endfor %}

      {% block header %}{% endblock %}
      {% block content %}{% endblock %}
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
